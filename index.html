<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>בדיחה בלחיצה</title>
  <meta name="description" content="כותבים נושא, לוחצים, וצוחקים.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap">
  <style>
    :root {
      --sun: #FFE15A;
      --paper: #FFFFFF;
      --ink: #2B1E4A;
      --ink-soft: #4A3D6B;
      --red: #F23D2F;
      --blue: #2E9BFF;
      --error: #C0261B;
      --error-bg: #FFE8EC;
      --hint: #756B92;
      --gap: 14px;
      --side: 18px;
      --font-ui: "Fredoka", system-ui, sans-serif;
      --font-joke: "Playpen Sans Hebrew", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--sun);
      background-image: url("assets/bg-doodles.svg"), url("assets/bg-dots.svg");
      background-repeat: no-repeat, repeat;
      background-position: top center, 0 0;
      background-size: 440px auto, 16px 16px;
      color: var(--ink);
      font-family: var(--font-ui);
      font-weight: 500;
      display: flex;
      flex-direction: column;
    }

    main {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 28px var(--side) 24px;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
      flex: 1;
    }

    .logo {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .intro {
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink-soft);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 18px;
      font-weight: 600;
    }

    input {
      width: 100%;
      font-family: var(--font-ui);
      font-size: 19px;
      font-weight: 500;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      box-shadow: 4px 4px 0 var(--ink);
      padding: 12px 16px;
      transform: rotate(0.6deg);
      outline: none;
    }

    input::placeholder { color: var(--hint); opacity: 1; }

    input:focus-visible {
      box-shadow: 4px 4px 0 var(--ink), 0 0 0 4px var(--blue);
    }

    .btn {
      width: 100%;
      min-height: 64px;
      font-family: var(--font-ui);
      font-size: 24px;
      font-weight: 700;
      color: #FFFFFF;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink);
      margin-bottom: 8px;
      transform: rotate(-1deg);
      cursor: pointer;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:focus-visible {
      outline: 4px solid var(--blue);
      outline-offset: 4px;
    }

    .btn:active,
    .btn:disabled {
      transform: rotate(-1deg) translateY(6px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .btn:disabled { cursor: wait; }

    /* בועת הבדיחה */
    .bubble {
      position: relative;
      min-height: 190px;
      margin-top: 6px;
      padding: 22px 22px 24px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-1.2deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-align: center;
    }

    .mascot {
      display: block;
      width: 118px;
      height: auto;
      transform-origin: 50% 100%;
    }

    .message {
      margin: 0;
      font-size: 17px;
      font-weight: 500;
      line-height: 1.45;
      color: var(--ink-soft);
      white-space: pre-line;
    }

    .bubble[data-state="idle"] .mascot {
      animation: bounce 2.4s ease-in-out infinite;
    }

    .bubble[data-state="think"] .mascot {
      animation: squash 0.5s ease-in-out infinite alternate;
    }

    .bubble[data-state="joke"] {
      align-items: stretch;
      padding: 30px 24px 26px;
    }

    .bubble[data-state="joke"] .mascot {
      position: absolute;
      top: -34px;
      right: -14px;
      width: 86px;
      transform: rotate(8deg);
      transform-origin: 50% 50%;
      animation: roll 0.45s ease-in-out 4;
    }

    .bubble[data-state="joke"] .message {
      font-family: var(--font-joke);
      font-size: 25px;
      line-height: 1.55;
      color: var(--ink);
      text-align: start;
    }

    .bubble[data-state="error"] {
      background: var(--error-bg);
    }

    .bubble[data-state="error"] .mascot {
      animation: swing 0.6s ease-in-out 2;
    }

    .bubble[data-state="error"] .message {
      color: var(--error);
      font-weight: 600;
    }

    footer {
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
      padding: 8px var(--side) calc(16px + env(safe-area-inset-bottom));
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes squash {
      from { transform: scale(1, 1); }
      to { transform: scale(1.06, 0.86); }
    }

    @keyframes roll {
      0%, 100% { transform: rotate(8deg); }
      30% { transform: rotate(-10deg) translateY(-3px); }
      65% { transform: rotate(20deg); }
    }

    @keyframes swing {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg); }
      75% { transform: rotate(12deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden">בדיחה בלחיצה</h1>
    <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה" width="300" height="158">

    <p class="intro">כותבים נושא, לוחצים, וצוחקים.<br>בלי נושא, מקבלים בדיחה כללית.</p>

    <form id="joke-form" novalidate>
      <div class="field">
        <label for="topic">על מה הבדיחה?</label>
        <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off" enterkeyhint="send">
      </div>
      <button id="joke-btn" class="btn" type="submit">תנו לי בדיחה!</button>
    </form>

    <section class="bubble" id="bubble" data-state="idle" aria-label="הבדיחה">
      <img class="mascot" id="mascot" src="assets/mascot-idle.svg" alt="" width="118" height="110">
      <p class="message" id="message" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    </section>
  </main>

  <footer>מיישם AI ואוטומציה · 53500</footer>

  <script>
    const form = document.getElementById("joke-form");
    const input = document.getElementById("topic");
    const button = document.getElementById("joke-btn");
    const bubble = document.getElementById("bubble");
    const mascot = document.getElementById("mascot");
    const message = document.getElementById("message");

    const BUTTON_TEXT = {
      idle: "תנו לי בדיחה!",
      think: "חושב...",
      joke: "עוד בדיחה!",
      error: "לנסות שוב",
    };

    function setState(state, text) {
      bubble.dataset.state = state;
      mascot.src = `assets/mascot-${state}.svg`;
      message.textContent = text;
      button.textContent = BUTTON_TEXT[state];
      button.disabled = state === "think";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const topic = input.value.trim().slice(0, 100);

      setState("think", topic ? `מחפש בדיחה על ${topic}...` : "מחפש בדיחה...");

      try {
        const response = await fetch("/api/joke", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ topic }),
        });
        const data = await response.json().catch(() => ({}));

        if (response.ok && data.joke) {
          setState("joke", data.joke);
        } else {
          setState("error", data.error || "משהו השתבש. נסו שוב.");
        }
      } catch {
        setState("error", "אין חיבור לשרת כרגע. נסו שוב.");
      }
    });
  </script>
</body>
</html>
